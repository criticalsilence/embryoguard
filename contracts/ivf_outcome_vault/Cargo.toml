[package]
name = "embryoguard-outcome-vault"
version = "1.0.0"
authors = ["Caner (Senior Clinical Embryologist & NEAR Builder)"]
edition = "2021"
description = "NEAR Smart Contract for Transparent IVF Outcome Assurance, Milestone Escrow, Embryologist Oracle Attestation, and Cross-Chain NEAR Intents Refunds"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
